version: 2

# Minor/patch updates arrive as one grouped PR per ecosystem each week.
# Semver-major bumps (e.g. TypeScript 7, ESLint 10, .NET 11, Node 26) are ignored here and
# adopted deliberately in their own PRs, since they tend to need code or tooling changes.

updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      nuget-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/senssera-web"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directories: ["/src/SensSera.Api", "/src/SensSera.Simulator", "/senssera-web"]
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
