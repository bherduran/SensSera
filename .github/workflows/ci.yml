name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore SensSera.slnx

      - name: Build
        run: dotnet build SensSera.slnx --no-restore

      - name: Unit tests
        run: dotnet test tests/SensSera.UnitTests --no-build

      # Testcontainers starts postgres:18 on the runner's Docker daemon.
      - name: Integration tests
        # Fail fast with a dump instead of hanging the runner if a test ever stalls.
        run: dotnet test tests/SensSera.IntegrationTests --no-build --blame-hang-timeout 5m

      - name: Vulnerable packages
        run: |
          dotnet list SensSera.slnx package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          ! grep -q "has the following vulnerable packages" vuln.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: senssera-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: senssera-web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: docker compose build
