name: Firmware

on:
  push:
    branches: ["**"]
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    branches: [main]
    paths: ["firmware/**", ".github/workflows/firmware.yml"]

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Toolchains and libraries are ~1 GB; key on the pinned versions in platformio.ini.
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}

      - run: pip install platformio==6.2.0

      - name: Unit tests (host)
        run: pio test -e native

      - name: Build ESP32-S3 image
        env:
          FIRMWARE_VERSION: 0.1.0+${{ github.sha }}
        run: |
          export FIRMWARE_VERSION="${FIRMWARE_VERSION:0:14}"
          echo "FIRMWARE_VERSION=$FIRMWARE_VERSION" >> "$GITHUB_ENV"
          pio run -e esp32s3

      # Separate images with their offsets, not one merged file: a merged image fills the
      # gap at 0x9000 and would wipe NVS (Wi-Fi + token) when flashed from the browser.
      - name: Collect images
        run: |
          out=../fw-out && mkdir -p $out
          b=.pio/build/esp32s3
          cp $b/bootloader.bin $b/partitions.bin $b/firmware.bin $out/
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin $out/
          cat > $out/offsets.txt <<'EOF'
          0x0000  bootloader.bin
          0x8000  partitions.bin
          0xe000  boot_app0.bin
          0x10000 firmware.bin
          EOF
          # Read by the web install page (/kurulum): which files to write where. Offsets are
          # decimal because JSON has no hex literals.
          cat > $out/manifest.json <<EOF
          {
            "version": "$FIRMWARE_VERSION",
            "tag": "fw-${GITHUB_SHA:0:8}",
            "chipFamily": "ESP32-S3",
            "parts": [
              { "file": "bootloader.bin", "offset": 0 },
              { "file": "partitions.bin", "offset": 32768 },
              { "file": "boot_app0.bin", "offset": 57344 },
              { "file": "firmware.bin", "offset": 65536 }
            ]
          }
          EOF
          ls -l $out

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-esp32s3-${{ github.sha }}
          path: fw-out/
          retention-days: 30

  # Every firmware change merged to main becomes a release; the install page reads the latest
  # one. Each release keeps its own tag, so an older build can still be flashed by hand.
  release:
    needs: firmware
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: firmware-esp32s3-${{ github.sha }}
          path: fw-out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(jq -r .tag fw-out/manifest.json)
          version=$(jq -r .version fw-out/manifest.json)
          gh release create "$tag" fw-out/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Firmware $version" \
            --notes "ESP32-S3 image built from $GITHUB_SHA. Install it from the web app's /kurulum page; offsets are in manifest.json and offsets.txt."
