; Saksı Pilotu board firmware (PRD §6). Versions are pinned so a CI build today and
; one in December produce the same binary.

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = platformio/espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
; N16R8: 16 MB quad flash, 8 MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
; Two app slots + NVS: room for OTA later without changing the layout the friend's board has.
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial is the native USB port (the one marked "USB"), so no CH343 driver is needed.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
build_unflags = -std=gnu++11
build_src_flags = -std=gnu++17 -Wall -Wextra -Wformat=2 -Werror
lib_deps =
    adafruit/DHT sensor library@1.4.7
    adafruit/Adafruit Unified Sensor@1.1.15
    claws/BH1750@1.3.0
extra_scripts = pre:scripts/version.py
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Board-independent logic (lib/core) on the host: `pio test -e native`. Needs gcc.
[env:native]
platform = platformio/native@1.2.1
build_flags = -std=gnu++17 -Wall -Wextra -Wformat=2 -Werror
test_framework = unity
lib_deps =
    throwtheswitch/Unity@2.6.1
